{% extends "base.html" %}
{% block content %}
<div class="card card-custom p-4">
    <h4 class="mb-4"><i class="fa-solid fa-bed text-warning"></i> Свободные номера на дату</h4>
    
    <div class="row mb-4">
        <div class="col-md-4">
            <label class="form-label">Дата заезда:</label>
            <input type="date" id="dateInput" class="form-control" value="2026-11-20">
        </div>
        <div class="col-md-4">
            <label class="form-label">Категория:</label>
            <select id="categoryInput" class="form-select">
                <option value="">Все категории</option>
                <option value="Эконом">Эконом</option>
                <option value="Стандарт">Стандарт</option>
                <option value="Люкс">Люкс</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Количество мест:</label>
            <select id="placesInput" class="form-select">
                <option value="">Любое</option>
                <option value="1">1 место</option>
                <option value="2">2 места</option>
                <option value="3">3 места</option>
            </select>
        </div>
    </div>

    <button class="btn btn-primary mb-3 w-25" onclick="fetchFreeRooms()">Показать свободные номера</button>
    
    <span id="status" class="text-muted ms-3"></span>

    <div class="table-responsive">
        <table class="table table-hover" id="resultTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
function fetchFreeRooms() {
    const date = document.getElementById('dateInput').value;
    const category = document.getElementById('categoryInput').value;
    const places = document.getElementById('placesInput').value;
    const statusSpan = document.getElementById('status');
    
    statusSpan.innerText = 'Поиск...';

    fetch('/api/free_rooms', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({date: date, category: category, places: places})
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            statusSpan.innerText = 'Ошибка!';
            alert(data.error);
            return;
        }
        statusSpan.innerText = data.status;
        const thead = document.querySelector('#resultTable thead');
        const tbody = document.querySelector('#resultTable tbody');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        if (data.columns.length > 0) {
            let headerRow = '<tr>';
            data.columns.forEach(col => headerRow += `<th>${col}</th>`);
            headerRow += '</tr>';
            thead.innerHTML = headerRow;

            data.rows.forEach(row => {
                let bodyRow = '<tr>';
                row.forEach(cell => bodyRow += `<td>${cell}</td>`);
                bodyRow += '</tr>';
                tbody.innerHTML += bodyRow;
            });
        }
    });
}
// Запускаем поиск при загрузке страницы
document.addEventListener('DOMContentLoaded', fetchFreeRooms);
</script>
{% endblock %}
